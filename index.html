<!DOCTYPE html>
<html>
<head>
  <title>Valentine Proposal</title>
  <style>
    body {
      text-align: center;
      margin-top: 150px;
      font-family: Arial, sans-serif;
      background-color: #ffe6f0;
    }

    h1 {
      color: #ff3366;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      margin: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
    }

    #no {
      background-color: #999;
      color: white;
      position: absolute;
    }
  </style>
</head>

<body>

  <h1>Will you be my Valentine Sakshi 💖</h1>

  <button id="yes"
    onclick="window.location.href='https://wa.me/917982332728?text=Yes%20I%20will%20be%20your%20Valentine%20❤️'">
    Yes 💕
  </button>

  <button id="no">No 😜</button>

  <script>
    var noBtn = document.getElementById("no");

    noBtn.addEventListener("mouseover", function () {
      var x = Math.random() * (window.innerWidth - 100);
      var y = Math.random() * (window.innerHeight - 50);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });
  </script>

</body>
</html>
